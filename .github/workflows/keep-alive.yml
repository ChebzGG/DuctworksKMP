name: Keep Supabase Alive

on:
  schedule:
    # Запуск каждые 3 дня в 12:00 UTC (база не уснёт, так как лимит 7 дней)
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Позволяет протестировать запуск вручную кнопкой в GitHub UI

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets and ping Supabase
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$RAW_URL" ]; then
            echo "::error::Секрет SUPABASE_URL пустой или не найден!"
            exit 1
          fi

          if [ -z "$RAW_KEY" ]; then
            echo "::error::Секрет SUPABASE_ANON_KEY пустой или не найден!"
            exit 1
          fi

          # 1. Очистка URL: удаляем пробелы, кавычки, /rest/v1 и завершающие слэши
          BASE_URL=$(echo "$RAW_URL" | tr -d '[:space:]"' | sed "s/'//g" | sed 's:/rest/v1/*$::' | sed 's:/*$::')
          API_KEY=$(echo "$RAW_KEY" | tr -d '[:space:]"' | sed "s/'//g")

          # 2. Если скопировали ссылку из дашборда:
          if [[ "$BASE_URL" =~ dashboard/project/([a-zA-Z0-9]+) ]]; then
            PROJECT_REF="${BASH_REMATCH[1]}"
            BASE_URL="https://${PROJECT_REF}.supabase.co"
          fi

          echo "Target Supabase Host: ${BASE_URL}"

          # 3. Пингуем Auth Health (всегда отвечает 200 OK при валидном apikey)
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${BASE_URL}/auth/v1/health" \
            -H "apikey: ${API_KEY}" \
            -H "Authorization: Bearer ${API_KEY}")

          echo "Auth Health HTTP Status: $AUTH_STATUS"

          if [ "$AUTH_STATUS" -eq 200 ]; then
            echo "✅ Успешно! Supabase активен (Auth Health ответил 200 OK)."
            exit 0
          fi

          # 4. Проверяем также REST API
          REST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${BASE_URL}/rest/v1/" \
            -H "apikey: ${API_KEY}" \
            -H "Authorization: Bearer ${API_KEY}")

          echo "REST API HTTP Status: $REST_STATUS"

          if [ "$REST_STATUS" -eq 200 ]; then
            echo "✅ Успешно! Supabase активен (REST API ответил 200 OK)."
            exit 0
          fi

          echo "::error::Не удалось подключиться к Supabase (статусы: Auth=$AUTH_STATUS, REST=$REST_STATUS)."
          exit 1
