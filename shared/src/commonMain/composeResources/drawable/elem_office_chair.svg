  <line x1="24" y1="25" x2="24" y2="13" stroke="#64748B" stroke-width="2"/>
  <line x1="24" y1="25" x2="35" y2="17" stroke="#64748B" stroke-width="2"/>
  <line x1="24" y1="25" x2="31" y2="36" stroke="#64748B" stroke-width="2"/>
  <line x1="24" y1="25" x2="17" y2="36" stroke="#64748B" stroke-width="2"/>
  <line x1="24" y1="25" x2="13" y2="17" stroke="#64748B" stroke-width="2"/>
  <circle cx="24" cy="13" r="2" fill="#334155"/>
  <circle cx="35" cy="17" r="2" fill="#334155"/>
  <circle cx="31" cy="36" r="2" fill="#334155"/>
